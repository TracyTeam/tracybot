name: Build Check (Codex plugin)

on:
  pull_request:
    branches:
      - main
    paths:
      - 'codex-plugin/**'

jobs:
  build-codex:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codex-plugin

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check Build
        run: bun run build

      - name: Run Tests
        run: bun test
